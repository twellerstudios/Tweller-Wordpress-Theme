<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Christmas Minis — image ad</title>
<!-- Render: image-ad.html?fmt=4x5 (1080x1350), 1x1 (1080x1080), 9x16 (1080x1920). See render.mjs. -->
<style>
@font-face { font-family: "Cormorant"; src: url(assets/fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Cormorant"; src: url(assets/fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Cormorant"; src: url(assets/fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2"); font-weight: 500; font-style: italic; }
@font-face { font-family: "InterX"; src: url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "InterX"; src: url(assets/fonts/inter-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "InterX"; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
:root {
  --green: #12281f; --green-2: #1a3a2d; --gold: #e2c27e; --gold-line: rgba(226, 194, 126, .55);
  --cream: #f7f0e4; --red: #a01d26; --ink: #15110e;
  --serif: "Cormorant", Georgia, serif; --sans: "InterX", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--green); }
.ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--cream);
  background: radial-gradient(ellipse 90% 60% at 50% 0%, #21473a 0%, var(--green) 62%), var(--green);
  display: flex; flex-direction: column; align-items: center; padding: 52px 64px 64px; text-align: center; }
/* faint inner frame */
.ad::before { content: ""; position: absolute; inset: 22px; border: 1px solid rgba(226, 194, 126, .28); border-radius: 6px; pointer-events: none; }

.logo { width: 118px; height: auto; opacity: .96; }
.eyebrow { margin: 18px 0 0; font: 600 17px/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
.title { margin: 18px 0 0; font: 600 114px/.92 var(--serif); letter-spacing: -.012em; }
.price { margin: 10px 0 0; display: flex; align-items: baseline; justify-content: center; gap: 14px; }
.price i { font: italic 500 58px/1 var(--serif); color: var(--cream); }
.price b { font: 700 80px/1 var(--sans); letter-spacing: -.025em; color: var(--gold); }

.grid { margin-top: 32px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { position: relative; margin: 0; aspect-ratio: 3 / 2; border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--gold-line), 0 22px 40px -22px rgba(0, 0, 0, .8); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 16px 12px; text-align: left;
  font: italic 500 30px/1 var(--serif); color: #fff; background: linear-gradient(transparent, rgba(8, 6, 5, .72)); }
.tile figcaption span { font: 700 13px/1 var(--sans); letter-spacing: .2em; color: var(--gold); margin-right: 10px; vertical-align: 4px; font-style: normal; }

.facts { margin: 28px 0 0; padding: 0; list-style: none; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
.facts li { padding: 4px 18px; font: 400 21px/1.35 var(--sans); color: rgba(247, 240, 228, .9); }
.facts li + li { border-left: 1px solid var(--gold-line); }
.facts strong { display: block; margin-bottom: 4px; font: 600 28px/1.05 var(--serif); color: #fff; letter-spacing: .005em; }

.cta { margin-top: auto; padding-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.cta__pill { padding: 17px 36px; border-radius: 999px; background: var(--red); font: 700 27px/1 var(--sans); letter-spacing: .01em;
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .7); }
.cta__small { font: 500 19px/1 var(--sans); letter-spacing: .06em; color: rgba(247, 240, 228, .72); }
.cta__small b { color: var(--gold); font-weight: 600; }

/* 1:1 — tighter */
.fmt-1x1 .ad { height: 1080px; padding: 46px 60px 50px; justify-content: center; }
.fmt-1x1 .cta { margin-top: 30px; padding-top: 0; }
.fmt-1x1 .logo { width: 92px; }
.fmt-1x1 .eyebrow { margin-top: 12px; font-size: 14px; }
.fmt-1x1 .title { margin-top: 14px; font-size: 98px; }
.fmt-1x1 .price { margin-top: 6px; }
.fmt-1x1 .price i { font-size: 46px; }
.fmt-1x1 .price b { font-size: 68px; }
.fmt-1x1 .grid { margin-top: 26px; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.fmt-1x1 .tile { aspect-ratio: 2 / 3; }
.fmt-1x1 .tile figcaption { font-size: 22px; padding: 30px 10px 10px; text-align: center; }
.fmt-1x1 .tile figcaption span { display: block; margin: 0 0 6px; vertical-align: 0; }
.fmt-1x1 .facts { margin-top: 26px; }
.fmt-1x1 .facts li { font-size: 18px; padding: 2px 14px; }
.fmt-1x1 .facts strong { font-size: 24px; }
.fmt-1x1 .cta__pill { font-size: 24px; padding: 15px 30px; }

/* 9:16 — Stories: keep words clear of the top 14% and bottom 20% */
.fmt-9x16 .ad { height: 1920px; padding: 268px 64px 384px; justify-content: flex-start; }
.fmt-9x16 .ad::before { inset: 22px; }
.fmt-9x16 .title { font-size: 132px; }
.fmt-9x16 .grid { margin-top: 44px; }
.fmt-9x16 .facts { margin-top: 40px; }
.fmt-9x16 .cta { margin-top: 44px; padding-top: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const fmt = q.get('fmt') || '4x5';
  document.body.classList.add('fmt-' + fmt);
  const S = [
    { slug: 'classic-red-hearth', name: 'Classic Red Hearth', pos: '50% 55%' },
    { slug: 'fireside-library',   name: 'Fireside Library',   pos: '52% 58%' },
    { slug: 'snowy-window',       name: 'Snowy Window',       pos: '48% 50%' },
    { slug: 'champagne-gold',     name: 'Champagne Gold',     pos: '42% 55%' }
  ];
  const pos1x1 = { 'classic-red-hearth': '50% 50%', 'fireside-library': '50% 55%', 'snowy-window': '48% 50%', 'champagne-gold': '50% 55%' };
  const tiles = S.map((s, i) => `<figure class="tile"><img src="assets/scenes/${s.slug}.jpg" style="object-position:${fmt === '1x1' ? pos1x1[s.slug] : s.pos}" alt=""><figcaption><span>0${i + 1}</span>${s.name}</figcaption></figure>`).join('');
  document.getElementById('app').innerHTML = `
  <div class="ad">
    <img class="logo" src="assets/logo-cream.png" alt="Tweller Studios">
    <p class="eyebrow">Christmas 2026 · Trinidad &amp; Tobago</p>
    <h1 class="title">Christmas Minis</h1>
    <p class="price"><i>from</i><b>TTD 550</b></p>
    <div class="grid">${tiles}</div>
    <ul class="facts">
      <li><strong>Studio or at home</strong>We bring the backdrop</li>
      <li><strong>4 scenes or your decor</strong>Pick a scene, or keep it real</li>
      <li><strong>Book by Nov 30</strong>Get an extra scene free</li>
    </ul>
    <div class="cta">
      <span class="cta__pill">Book online · twellerstudios.com</span>
      <span class="cta__small">Last shoot date <b>Dec 24</b></span>
    </div>
  </div>`;
})();
</script>
</body>
</html>
