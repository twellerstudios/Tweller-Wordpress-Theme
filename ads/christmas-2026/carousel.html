<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick Your Scene — carousel</title>
<!-- Render: carousel.html?card=1..6 at 1080x1080, or ?card=1&fmt=4x5 at 1080x1350 (see render.mjs).
     A real client photo can be added to a scene card with &photo=<path to cut-out PNG>. -->
<style>
@font-face { font-family: "Cormorant"; src: url(assets/fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Cormorant"; src: url(assets/fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2"); font-weight: 500; font-style: italic; }
@font-face { font-family: "InterX"; src: url(assets/fonts/inter-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "InterX"; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
:root { --red: #9a1b23; --green: #173a2e; --gold: #e2bf74; --cream: #f7f0e4; --ink: #15110e;
  --serif: "Cormorant", Georgia, serif; --sans: "InterX", Arial, sans-serif; --m: 64px; }
html, body { margin: 0; background: var(--ink); }
.card { position: relative; width: 1080px; height: 1080px; overflow: hidden; color: #fff; background: var(--ink); }
.fmt-4x5 .card { height: 1350px; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; }
.brand { position: absolute; top: var(--m); left: var(--m); font: 600 20px/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.9);
  text-shadow: 0 1px 10px rgba(0,0,0,.5); }

/* Card 1 — collage */
.collage { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; background: var(--cream); }
.collage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fmt-4x5 .collage { bottom: 330px; }
.hook-plate { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 760px; padding: 46px 50px 42px; text-align: center;
  background: rgba(21, 17, 14, .82); border: 2px solid rgba(226, 191, 116, .7); border-radius: 28px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
.fmt-4x5 .hook-plate { top: 510px; }
.hook-plate h1 { margin: 0; font: 600 62px/1.05 var(--serif); }
.hook-plate .hook-note { margin: 16px 0 0; font: 600 18px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: rgba(247, 240, 228, .75); }
.hook-plate h1 em { display: block; font-style: italic; font-weight: 500; color: var(--gold); margin-top: 8px; }
.swipe { position: absolute; right: var(--m); bottom: var(--m); padding: 16px 26px; border-radius: 999px; background: var(--red);
  font: 700 26px/1 var(--sans); letter-spacing: .04em; box-shadow: 0 12px 30px -10px rgba(0,0,0,.6); }
.fmt-4x5 .swipe { display: none; }
.offer { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--green); text-align: center; }
.offer p { margin: 0; }
.offer .o1 { font: 600 84px/1 var(--serif); }
.offer .o1 b { font: 700 72px/1 var(--sans); color: var(--gold); letter-spacing: -.02em; }
.offer .o2 { font: 600 28px/1.2 var(--sans); color: rgba(247, 240, 228, .85); }

/* Cards 2–5 — one scene */
.scene-label { position: absolute; left: var(--m); bottom: var(--m); padding: 16px 26px 18px 22px; border-radius: 16px; flex-direction: column; align-items: flex-start !important; gap: 10px !important;
  background: rgba(21, 17, 14, .62); backdrop-filter: blur(8px); display: flex; align-items: baseline; gap: 16px; }
.scene-label span { font: 700 22px/1 var(--sans); letter-spacing: .2em; color: var(--gold); }
.scene-label b { font: italic 500 58px/1 var(--serif); }
.photo { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 62%; }

/* Card 6 — call to action */
.cta .bg { filter: blur(8px) brightness(.5) saturate(1.15); transform: scale(1.08); }
.cta .shade { background: radial-gradient(ellipse at 50% 45%, rgba(23, 58, 46, .35), rgba(12, 9, 7, .75)); }
.cta-body { position: absolute; inset: var(--m); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; }
.cta-body p { margin: 0; }
.logo { width: 200px; height: auto; margin-bottom: 18px; }
.c1 { font: 600 112px/.95 var(--serif); }
.c2 { font: 700 104px/1 var(--sans); color: var(--gold); letter-spacing: -.02em; }
.c2 i { font: italic 500 64px/1 var(--serif); color: #fff; letter-spacing: 0; margin-right: 8px; }
.c3 { font: 600 32px/1.3 var(--sans); color: rgba(247, 240, 228, .88); margin-top: 8px !important; }
.c2 i { display: block; margin: 0 0 8px; font-size: 46px; }
.c5 { font: italic 500 46px/1 var(--serif); color: var(--gold); }
.c4 { margin-top: 26px !important; padding: 22px 40px; border-radius: 999px; background: var(--red); font: 700 34px/1 var(--sans); }

@font-face { font-family: "Playfair"; src: url(assets/fonts/playfair-display-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: "Playfair"; src: url(assets/fonts/playfair-display-latin-700-italic.woff2) format("woff2"); font-weight: 700; font-style: italic; }
.ribbon { position: relative; display: inline-block; padding: 26px 50px 30px; border-radius: 8px;
  background: linear-gradient(180deg, #c42a33 0%, #a01d26 46%, #7c121b 100%);
  box-shadow: inset 0 0 0 5px #8e1820, inset 0 0 0 7px #e6c47c, inset 0 12px 20px -10px rgba(255,255,255,.35), 0 22px 44px -16px rgba(0,0,0,.75); }
.ribbon::before, .ribbon::after { content: ""; position: absolute; bottom: -24px; width: 76px; height: 70%; z-index: -1; background: linear-gradient(180deg, #8a1720, #5e0d14); }
.ribbon::before { left: -42px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 30% 50%); }
.ribbon::after { right: -42px; clip-path: polygon(0 0, 100% 0, 70% 50%, 100% 100%, 0 100%); }
.ribbon__holly { position: absolute; left: 50%; top: -28px; width: 96px; height: 52px; transform: translateX(-50%); }
.foil { display: block; font-family: "Playfair", Georgia, serif; font-weight: 800; letter-spacing: -.005em; text-wrap: balance;
  background: linear-gradient(180deg, #fff8df 0%, #f7df9b 34%, #dcae52 58%, #b98530 72%, #f6dfa0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(66, 6, 12, .9)) drop-shadow(0 8px 14px rgba(0, 0, 0, .35)); }
.c1.ribbon { margin-bottom: 18px !important; }
.c1 .foil { font-size: 104px; line-height: 1; }
.hook-plate.ribbon { padding: 40px 50px 34px; width: 800px; }
.hook-plate.ribbon h1 .foil { font-size: 60px; line-height: 1.1; }
.hook-plate.ribbon h1 em { font-family: "Playfair", Georgia, serif; font-weight: 700; font-style: italic; font-size: 44px; color: #fff4d6; }
.hook-plate.ribbon .hook-note { color: rgba(255, 244, 214, .85); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const n = +(q.get('card') || 1);
  const fmt = q.get('fmt') || '1x1';
  const photo = q.get('photo') || '';
  document.body.classList.add('fmt-' + fmt);
  const S = [
    { slug: 'fireside-library',   name: 'Fireside Library',   pos: '52% 58%' },
    { slug: 'classic-red-hearth', name: 'Classic Red Hearth', pos: '50% 55%' },
    { slug: 'snowy-window',       name: 'Snowy Window',       pos: '48% 52%' },
    { slug: 'champagne-gold',     name: 'Champagne Gold',     pos: '42% 55%' }
  ];
  const img = (s, cls) => `<img class="${cls || ''}" src="assets/scenes/${s.slug}.jpg" style="object-position:${s.pos}" alt="">`;
  let html = '';
  if (n === 1) {
    html = `<div class="card">
      <div class="collage">${S.map((s) => img(s)).join('')}</div>
      <div class="hook-plate ribbon"><svg class="ribbon__holly" viewBox="0 0 120 64" aria-hidden="true"><path d="M58 40 C40 18 18 14 4 24 C14 26 16 34 10 40 C22 36 28 44 26 52 C38 42 50 46 58 40Z" fill="#1f5a3a" stroke="#0f3322" stroke-width="2"/><path d="M62 40 C80 18 102 14 116 24 C106 26 104 34 110 40 C98 36 92 44 94 52 C82 42 70 46 62 40Z" fill="#256b45" stroke="#0f3322" stroke-width="2"/><circle cx="52" cy="40" r="9" fill="#c8202b"/><circle cx="68" cy="40" r="9" fill="#d4262f"/><circle cx="60" cy="30" r="9" fill="#e0353d"/><circle cx="57" cy="27" r="2.5" fill="#fff" opacity=".6"/></svg><h1><span class="foil">Thinking about Christmas photos of you &amp; your family?</span><em>4 scenes to choose from</em></h1><p class="hook-note">Digital backdrops, edited in</p></div>
      ${fmt === '4x5'
        ? `<div class="offer"><p class="o1">Christmas Minis <b>from TTD 550</b></p><p class="o2">Studio or at your home &nbsp;•&nbsp; Your scene or your decor</p></div>`
        : `<div class="swipe">swipe →</div>`}
    </div>`;
  } else if (n >= 2 && n <= 5) {
    const s = S[n - 2];
    html = `<div class="card">${img(s, 'bg')}
      <div class="shade" style="background:linear-gradient(180deg, rgba(12,9,7,.35), rgba(12,9,7,0) 25%, rgba(12,9,7,0) 70%, rgba(12,9,7,.35))"></div>
      ${photo ? `<img class="photo" src="${photo}" alt="">` : ''}
      <div class="brand">Tweller Studios</div>
      <div class="scene-label"><span>Digital scene 0${n - 1}</span><b>${s.name}</b></div>
    </div>`;
  } else {
    html = `<div class="card cta">${img(S[0], "bg")}<div class="shade"></div>
      <div class="cta-body">
        <img class="logo" src="assets/logo-cream.png" alt="Tweller Studios">
        <p class="c1 ribbon"><svg class="ribbon__holly" viewBox="0 0 120 64" aria-hidden="true"><path d="M58 40 C40 18 18 14 4 24 C14 26 16 34 10 40 C22 36 28 44 26 52 C38 42 50 46 58 40Z" fill="#1f5a3a" stroke="#0f3322" stroke-width="2"/><path d="M62 40 C80 18 102 14 116 24 C106 26 104 34 110 40 C98 36 92 44 94 52 C82 42 70 46 62 40Z" fill="#256b45" stroke="#0f3322" stroke-width="2"/><circle cx="52" cy="40" r="9" fill="#c8202b"/><circle cx="68" cy="40" r="9" fill="#d4262f"/><circle cx="60" cy="30" r="9" fill="#e0353d"/><circle cx="57" cy="27" r="2.5" fill="#fff" opacity=".6"/></svg><span class="foil">Book us now!</span></p>
        <p class="c2"><i>Christmas Minis from</i>TTD 550</p>
        <p class="c5">Limited spaces available</p>
        <p class="c3">Studio or at your home &nbsp;•&nbsp; 4 digital scenes or your own decor</p>
        <p class="c4">Tap to see all packages →</p>
      </div></div>`;
  }
  document.getElementById('app').innerHTML = html;
})();
</script>
</body>
</html>
